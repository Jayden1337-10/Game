name: Windows build

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["game/**", ".github/workflows/windows-build.yml"]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true
      - run: mkdir -p build && godot --headless --path game --editor --quit --import && godot --headless --path game --script res://tests/smoke_test.gd --check-only && timeout 90s godot --headless --path game --script res://tests/smoke_test.gd && timeout 180s godot --headless --path game --export-release "Windows Desktop" ../build/ForgottenWorld.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ForgottenWorld-Windows
          path: build/
